name: build-images

# 因为上游两个项目都没有发布可用的镜像，这里自建并推到 GHCR。
# 推完后镜像地址为：
#   ghcr.io/<你的GitHub用户名>/workbuddy2api:latest
#   ghcr.io/<你的GitHub用户名>/trae2api:latest
#
# 注意：仓库若是 private，GHCR 包默认也是 private，1Panel 宿主机需要先
#   docker login ghcr.io -u <用户名> -p <PAT>
# 才能拉取；仓库设为 public 则镜像自动公开。

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  WORKBUDDY_REPO: https://github.com/Zhengyuuuui/workbuddy2api
  # 固定 commit，保证构建可复现（2026-10-09）
  WORKBUDDY_SHA: 1cc32c9a98abb53796d8d4e8d477736fe1f0c4cc
  TRAE_REPO: https://github.com/JeffHu0912/trae2api
  # 固定 commit（2026-09-08）
  TRAE_SHA: ec20c088a375bc5a2989d43aa5b561b06a4382e7

jobs:
  workbuddy2api:
    name: build workbuddy2api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at pinned commit
        run: |
          git clone --filter=blob:none "$WORKBUDDY_REPO" upstream
          git -C upstream checkout "$WORKBUDDY_SHA"
          git -C upstream rev-parse HEAD

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: docker/workbuddy2api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/workbuddy2api:latest
            ghcr.io/${{ github.repository_owner }}/workbuddy2api:sha-${{ github.sha }}

  trae2api:
    name: build trae2api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at pinned commit
        run: |
          git clone --filter=blob:none "$TRAE_REPO" upstream
          git -C upstream checkout "$TRAE_SHA"
          git -C upstream rev-parse HEAD

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 直接用上游自带的 Dockerfile（Go 多阶段构建，非 root + healthcheck）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trae2api:latest
            ghcr.io/${{ github.repository_owner }}/trae2api:sha-${{ github.sha }}
